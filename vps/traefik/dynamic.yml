# =============================================================================
# Traefik Dynamic Configuration
# =============================================================================
# This file defines:
# - Routers: How incoming requests are matched and routed
# - Services: Backend endpoints that handle requests
# - TLS certificates: Cloudflare origin certificates
#
# This configuration is watched by Traefik and reloaded on changes.
# =============================================================================

# -----------------------------------------------------------------------------
# HTTP Configuration
# -----------------------------------------------------------------------------
http:
  # ---------------------------------------------------------------------------
  # Routers
  # ---------------------------------------------------------------------------
  # Routers match incoming requests and direct them to services
  routers:
    # Immich router - primary example application
    immich:
      # Match requests to app.example.com
      rule: "Host(`app.example.com`)"
      # Use HTTPS entrypoint
      entryPoints:
        - websecure
      # Forward to immich service
      service: immich
      # Apply TLS configuration
      tls:
        certResolver: ""  # Using manual certificates, not ACME
        options: modern
      # Apply middlewares for security headers
      middlewares:
        - security-headers
        - rate-limit

    # ---------------------------------------------------------------------------
    # Additional routers for other applications (uncomment as needed)
    # ---------------------------------------------------------------------------
    # jellyfin:
    #   rule: "Host(`media.example.com`)"
    #   entryPoints:
    #     - websecure
    #   service: jellyfin
    #   tls:
    #     options: modern
    #   middlewares:
    #     - security-headers

    # nextcloud:
    #   rule: "Host(`cloud.example.com`)"
    #   entryPoints:
    #     - websecure
    #   service: nextcloud
    #   tls:
    #     options: modern
    #   middlewares:
    #     - security-headers
    #     - rate-limit

  # ---------------------------------------------------------------------------
  # Services
  # ---------------------------------------------------------------------------
  # Services define backend endpoints
  services:
    immich:
      loadBalancer:
        servers:
          # Forward to socat bridge running on host
          # host.docker.internal resolves to the Docker host
          # Port 2283 is where socat-immich listens
          - url: "http://host.docker.internal:2283"
        # Health check for the backend
        healthCheck:
          path: /
          interval: 30s
          timeout: 5s
        # Pass original headers
        passHostHeader: true

    # jellyfin:
    #   loadBalancer:
    #     servers:
    #       - url: "http://host.docker.internal:8096"
    #     passHostHeader: true

    # nextcloud:
    #   loadBalancer:
    #     servers:
    #       - url: "http://host.docker.internal:8080"
    #     passHostHeader: true

  # ---------------------------------------------------------------------------
  # Middlewares
  # ---------------------------------------------------------------------------
  # Middlewares modify requests/responses
  middlewares:
    # Security headers middleware
    security-headers:
      headers:
        # Prevent clickjacking
        frameDeny: true
        # Prevent MIME type sniffing
        contentTypeNosniff: true
        # Enable XSS filter
        browserXssFilter: true
        # Referrer policy
        referrerPolicy: "strict-origin-when-cross-origin"
        # HSTS - be careful, this is cached by browsers
        stsSeconds: 31536000
        stsIncludeSubdomains: true
        stsPreload: true
        # Content Security Policy - adjust per application
        # contentSecurityPolicy: "default-src 'self'"

    # Rate limiting to prevent abuse
    rate-limit:
      rateLimit:
        # Average requests per second
        average: 100
        # Maximum burst
        burst: 200
        # Time period
        period: 1s

# -----------------------------------------------------------------------------
# TLS Configuration
# -----------------------------------------------------------------------------
tls:
  # TLS options for different security levels
  options:
    # Modern TLS configuration - TLS 1.3 only
    modern:
      minVersion: VersionTLS13
      sniStrict: true
    
    # Intermediate TLS configuration - TLS 1.2+
    # Use this if you need broader compatibility
    intermediate:
      minVersion: VersionTLS12
      cipherSuites:
        - TLS_ECDHE_ECDSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256
        - TLS_ECDHE_ECDSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_RSA_WITH_AES_256_GCM_SHA384
        - TLS_ECDHE_ECDSA_WITH_CHACHA20_POLY1305
        - TLS_ECDHE_RSA_WITH_CHACHA20_POLY1305
      sniStrict: true

  # Certificates - Cloudflare origin certificates
  certificates:
    - certFile: /etc/traefik/certs/origin.pem
      keyFile: /etc/traefik/certs/origin-key.pem

  # Default certificate store
  stores:
    default:
      defaultCertificate:
        certFile: /etc/traefik/certs/origin.pem
        keyFile: /etc/traefik/certs/origin-key.pem
